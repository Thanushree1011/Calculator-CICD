name: Calculator CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Run unit tests on GitHub Actions runner
      - name: Run unit tests
        run: python -m unittest -v

      # Step 4: Build Docker image
      - name: Build Docker image
        run: docker build -t calculator:latest .

      # Step 5: Run unit tests inside Docker container
      - name: Run tests inside Docker
        run: docker run --rm calculator:latest

      # Step 6: Set up AWS SAM CLI
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Debug GitHub OIDC configuration
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch or ref: $GITHUB_REF"
          echo "Ref type: $GITHUB_REF_TYPE"
          echo "Event: $GITHUB_EVENT_NAME"

      # Step 7: Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          debug: true1

      # Step 8: Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 9: Validate SAM template
      - name: Validate SAM template
        run: sam validate --lint

      # Step 10: Build SAM application
      - name: Build SAM application
        run: sam build

      # Step 11: Deploy application to AWS
